apiVersion: 1

providers:
  - name: platform
    orgId: 1
    folder: Platform
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    allowUiUpdates: false        # dashboards are code; edit them in git
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
