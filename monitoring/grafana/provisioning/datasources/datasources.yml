apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
      exemplarTraceIdDestinations: []

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 2000
      # Lets a log line jump to the metrics around it and back.
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: 'traceId=(\w+)'
          name: TraceID
          url: '$${__value.raw}'
