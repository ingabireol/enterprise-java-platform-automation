---
# ===========================================================================
# rollback.yml — return the application tier to the previously deployed release.
#
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/rollback.yml
#
# Reads the manifest deploy.yml wrote before it changed anything. Deliberately
# simpler and faster than the deployment: a rollback happens under pressure, so
# it asks no questions it can answer itself.
# ===========================================================================

- name: Roll the application tier back
  hosts: appservers
  serial: 1
  max_fail_percentage: 0
  tasks:
    - name: Read the rollback manifest
      ansible.builtin.slurp:
        src: "{{ app_base_dir }}/etc/rollback.manifest"
      register: _manifest

    - name: Parse the previous release
      ansible.builtin.set_fact:
        _previous: >-
          {{ (_manifest.content | b64decode).split('\n')
             | select('match', '^PREVIOUS_RELEASE=') | first
             | regex_replace('^PREVIOUS_RELEASE=', '') }}

    - name: Refuse to roll back when there is nothing to roll back to
      ansible.builtin.assert:
        that:
          - _previous | length > 0
          - _previous != 'none'
        fail_msg: >-
          No previous release recorded on {{ inventory_hostname }}. Restore from
          the artefact repository instead — see docs/runbooks/deployment.md.

    - name: Confirm the previous release is still on disk
      ansible.builtin.stat:
        path: "{{ app_base_dir }}/releases/{{ _previous }}"
      register: _prev_dir
      failed_when: not _prev_dir.stat.exists

    - name: Drain this node
      ansible.builtin.file:
        path: "{{ app_base_dir }}/etc/drain"
        state: touch
        mode: "0644"

    - name: Allow in-flight requests to finish
      ansible.builtin.pause:
        seconds: "{{ spring_shutdown_grace }}"

    - name: Stop the services
      ansible.builtin.systemd:
        name: "{{ item.name }}.service"
        state: stopped
      loop: "{{ spring_services }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Point current back at {{ _previous }}
      ansible.builtin.file:
        src: "{{ app_base_dir }}/releases/{{ _previous }}"
        dest: "{{ app_base_dir }}/current"
        state: link
        force: true

    - name: Start the services
      ansible.builtin.systemd:
        name: "{{ item.name }}.service"
        state: started
      loop: "{{ spring_services }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item.management_port }}{{ app_health_path }}"
        status_code: 200
      register: _ready
      until: _ready.status == 200
      retries: 30
      delay: 10
      loop: "{{ spring_services }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Return the node to the pool
      ansible.builtin.file:
        path: "{{ app_base_dir }}/etc/drain"
        state: absent

    - name: Record that a rollback happened
      ansible.builtin.lineinfile:
        path: "{{ app_base_dir }}/etc/rollback.manifest"
        line: "ROLLED_BACK_TO={{ _previous }} AT={{ ansible_date_time.iso8601 }}"
        create: true
        mode: "0640"

- name: Remind the operator what still needs doing
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Post-rollback checklist
      ansible.builtin.debug:
        msg:
          - "Application rolled back. Still outstanding:"
          - "1. Database migrations are NOT reverted — check whether the failed release applied any."
          - "2. Raise an incident record and capture the failure evidence before logs rotate."
          - "3. docs/runbooks/incident-response.md, section 'Failed deployment'."
