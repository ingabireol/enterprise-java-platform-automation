---
# Build a streaming replica with pg_basebackup.
#
# This is the same code path a point-in-time restore uses, which is deliberate:
# if building the replica works, the restore procedure has been exercised.

- name: Confirm the primary is reachable before destroying anything locally
  ansible.builtin.wait_for:
    host: "{{ postgresql_primary_host }}"
    port: "{{ postgresql_port }}"
    timeout: 30
  register: _primary_reachable

- name: Stop PostgreSQL before replacing the data directory
  ansible.builtin.service:
    name: "postgresql-{{ postgresql_version }}"
    state: stopped
  failed_when: false

- name: Move any existing data directory aside rather than deleting it
  ansible.builtin.command:
    cmd: "mv {{ postgresql_data_dir }} {{ postgresql_data_dir }}.pre-basebackup-{{ ansible_date_time.epoch }}"
    removes: "{{ postgresql_data_dir }}/PG_VERSION"

- name: Create an empty data directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Write the replication password file
  ansible.builtin.copy:
    content: "{{ postgresql_primary_host }}:{{ postgresql_port }}:*:{{ postgresql_replication_user }}:{{ vault_postgresql_replication_password }}\n"
    dest: /var/lib/pgsql/.pgpass
    owner: postgres
    group: postgres
    mode: "0600"
  no_log: true

- name: Take a base backup from the primary (this can take a long time)
  ansible.builtin.command:
    cmd: >-
      /usr/pgsql-{{ postgresql_version }}/bin/pg_basebackup
      --host={{ postgresql_primary_host }}
      --port={{ postgresql_port }}
      --username={{ postgresql_replication_user }}
      --pgdata={{ postgresql_data_dir }}
      --wal-method=stream
      --write-recovery-conf
      --checkpoint=fast
      --progress
      --verbose
    creates: "{{ postgresql_data_dir }}/PG_VERSION"
  become_user: postgres
  async: 14400
  poll: 60
  register: _basebackup

- name: Mark the cluster as a standby
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}/standby.signal"
    state: touch
    owner: postgres
    group: postgres
    mode: "0600"
    modification_time: preserve
    access_time: preserve
