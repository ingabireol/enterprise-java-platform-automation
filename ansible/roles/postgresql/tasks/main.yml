---
# PostgreSQL 16 with WAL archiving and streaming replication.
#
# Two things this role treats as non-negotiable, because both are the difference
# between "we have backups" and "we can recover":
#   * WAL archiving is on before the first byte of application data is written.
#   * The replica is built from a base backup taken through the same mechanism
#     a restore would use, so the restore path is exercised on day one.

- name: Install the PostgreSQL repository and server packages
  ansible.builtin.package:
    name:
      - "postgresql{{ postgresql_version }}-server"
      - "postgresql{{ postgresql_version }}-contrib"
      - python3-psycopg2
    state: present
  tags: [postgresql, packages]

- name: Create the WAL archive directory
  ansible.builtin.file:
    path: "{{ postgresql_archive_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  tags: [postgresql, wal]

- name: Check whether the cluster is already initialised
  ansible.builtin.stat:
    path: "{{ postgresql_data_dir }}/PG_VERSION"
  register: _pgdata
  tags: [postgresql]

- name: Initialise a new primary cluster
  ansible.builtin.command:
    cmd: "/usr/pgsql-{{ postgresql_version }}/bin/postgresql-{{ postgresql_version }}-setup initdb"
    creates: "{{ postgresql_data_dir }}/PG_VERSION"
  when:
    - not _pgdata.stat.exists
    - postgresql_role == 'primary'
  tags: [postgresql, init]

- name: Build the replica from a base backup of the primary
  ansible.builtin.include_tasks: replica.yml
  when:
    - not _pgdata.stat.exists
    - postgresql_role == 'replica'
  tags: [postgresql, replication]

- name: Deploy postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ postgresql_data_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0600"
    backup: true
  notify: Restart postgresql
  tags: [postgresql, config]

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
    backup: true
  notify: Reload postgresql
  tags: [postgresql, config, security]

- name: Generate the server TLS keypair
  when: postgresql_ssl | bool
  tags: [postgresql, tls]
  block:
    - name: Create the PostgreSQL server key
      community.crypto.openssl_privatekey:
        path: "{{ postgresql_data_dir }}/server.key"
        size: 2048
        owner: postgres
        group: postgres
        mode: "0600"

    - name: Create the PostgreSQL server CSR
      community.crypto.openssl_csr:
        path: "/tmp/pg-{{ inventory_hostname }}.csr"
        privatekey_path: "{{ postgresql_data_dir }}/server.key"
        common_name: "{{ inventory_hostname }}.{{ platform_domain }}"
        subject_alt_name:
          - "DNS:{{ inventory_hostname }}.{{ platform_domain }}"
          - "IP:{{ ansible_host }}"

    - name: Issue the PostgreSQL server certificate
      community.crypto.x509_certificate:
        path: "{{ postgresql_data_dir }}/server.crt"
        privatekey_path: "{{ postgresql_data_dir }}/server.key"
        csr_path: "/tmp/pg-{{ inventory_hostname }}.csr"
        provider: selfsigned
        selfsigned_not_after: "+825d"
        owner: postgres
        group: postgres
        mode: "0600"

- name: Enable and start PostgreSQL
  ansible.builtin.service:
    name: "postgresql-{{ postgresql_version }}"
    state: started
    enabled: true
  tags: [postgresql]

- name: Configure roles, databases and extensions on the primary
  ansible.builtin.include_tasks: primary.yml
  when: postgresql_role == 'primary'
  tags: [postgresql, provisioning]

- name: Install the Prometheus postgres_exporter
  ansible.builtin.include_tasks: exporter.yml
  tags: [postgresql, monitoring]
