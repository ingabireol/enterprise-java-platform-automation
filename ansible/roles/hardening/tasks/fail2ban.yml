---
- name: Install fail2ban
  ansible.builtin.package:
    name: [fail2ban, fail2ban-firewalld]
    state: present
  failed_when: false

- name: Deploy the fail2ban jail configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
