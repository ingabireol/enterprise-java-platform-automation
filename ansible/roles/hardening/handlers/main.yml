---
- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: Restart auditd
  # auditd refuses a plain systemctl restart by design.
  ansible.builtin.command: /usr/sbin/service auditd restart
  changed_when: true

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: reloaded

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Regenerate initramfs
  ansible.builtin.command: dracut -f
  changed_when: true
