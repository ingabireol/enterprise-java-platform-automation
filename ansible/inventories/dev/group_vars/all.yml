---
# Development tier — same roles as production, smaller numbers, softer gates.
platform_name: efp
platform_domain: dev.efp.example.gov
app_base_dir: /opt/{{ platform_name }}
app_data_dir: /var/lib/{{ platform_name }}
app_log_dir: /var/log/{{ platform_name }}
app_user: efpsvc
app_group: efpsvc

change_control_required: false
maintenance_window: "any time"

java_major_version: 21
java_vendor: temurin
java_home: /usr/lib/jvm/temurin-21-jdk
jvm_heap_max: 1g
jvm_heap_min: 512m
jvm_gc: G1
jvm_extra_opts:
  - "-XX:+HeapDumpOnOutOfMemoryError"
  - "-XX:HeapDumpPath={{ app_log_dir }}/heapdumps"
  - "-Duser.timezone=Africa/Kigali"
  - "-Dspring.devtools.restart.enabled=false"

spring_profile: dev
spring_services:
  - { name: efp-core,        port: 8081, management_port: 9081, heap: 1g }
  - { name: efp-reporting,   port: 8082, management_port: 9082, heap: 768m }
  - { name: efp-integration, port: 8083, management_port: 9083, heap: 512m }

tomcat_version: "10.1.34"
tomcat_http_port: 8080
tomcat_shutdown_port: 8005
tomcat_max_threads: 50
tomcat_context: /efp-ui

nginx_worker_processes: 2
nginx_client_max_body_size: 64m
nginx_tls_protocols: "TLSv1.2 TLSv1.3"
nginx_hsts_max_age: 0                    # no HSTS pinning on throwaway certs
nginx_upstream_keepalive: 8

postgresql_version: 16
postgresql_port: 5432
postgresql_data_dir: /var/lib/pgsql/16/data
postgresql_max_connections: 100
postgresql_shared_buffers: 512MB
postgresql_effective_cache_size: 1536MB
postgresql_work_mem: 4MB
postgresql_maintenance_work_mem: 128MB
postgresql_wal_level: replica
postgresql_archive_mode: "off"
postgresql_archive_dir: /var/lib/pgsql/wal_archive
postgresql_replication_user: replicator

backup_root: /backup/{{ platform_name }}
backup_full_schedule: "Sun *-*-* 02:00:00"
backup_incremental_schedule: ""
backup_retention_days: 7
backup_offsite_enabled: false
backup_verify_schedule: ""
rpo_minutes: 1440
rto_minutes: 480

prometheus_server: 10.10.10.11
node_exporter_port: 9100
promtail_loki_url: "http://10.10.10.11:3100/loki/api/v1/push"
alert_email: platform-ops@example.gov

hardening_profile: baseline
ssh_permit_root_login: "prohibit-password"
ssh_password_authentication: "no"
ssh_allow_groups: ["sysadmins", "platform-ops", "developers"]
ssh_client_alive_interval: 600
ssh_max_auth_tries: 5
firewall_backend: nftables
selinux_state: permissive
auditd_enabled: false
fail2ban_enabled: false
automatic_security_updates: true
password_max_age: 365
umask_default: "022"

ntp_servers: ["10.10.1.10"]
dns_servers: ["10.10.1.10"]
search_domains: ["{{ platform_domain }}"]
timezone: Africa/Kigali
