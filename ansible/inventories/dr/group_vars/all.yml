---
# Disaster-recovery tier. Configuration is deliberately identical to production
# except where the standby role demands otherwise — drift between prod and DR is
# the single most common reason a failover fails, so it is treated as a defect.
platform_name: efp
platform_domain: efp.example.gov           # same FQDN; DNS/GSLB decides the site
app_base_dir: /opt/{{ platform_name }}
app_data_dir: /var/lib/{{ platform_name }}
app_log_dir: /var/log/{{ platform_name }}
app_user: efpsvc
app_group: efpsvc

change_control_required: true
maintenance_window: "Saturday 22:00–02:00 CAT (mirrors production)"

# --- Standby behaviour -----------------------------------------------------
# Services are installed and enabled-but-stopped. dr-drill.yml and the documented
# failover procedure are the only things that start them.
app_services_started: false
app_services_enabled: true
postgresql_role: replica
postgresql_hot_standby: "on"
dr_promote_requires_confirmation: true
dr_drill_schedule: "quarterly"
dr_last_drill_reference: docs/runbooks/dr-failover.md

java_major_version: 21
java_vendor: temurin
java_home: /usr/lib/jvm/temurin-21-jdk
jvm_heap_max: 6g
jvm_heap_min: 6g
jvm_gc: G1
jvm_extra_opts:
  - "-XX:MaxGCPauseMillis=200"
  - "-XX:+HeapDumpOnOutOfMemoryError"
  - "-XX:HeapDumpPath={{ app_log_dir }}/heapdumps"
  - "-XX:+ExitOnOutOfMemoryError"
  - "-Duser.timezone=Africa/Kigali"

spring_profile: prod                        # identical profile: DR is production
spring_services:
  - { name: efp-core,        port: 8081, management_port: 9081, heap: 6g }
  - { name: efp-reporting,   port: 8082, management_port: 9082, heap: 4g }
  - { name: efp-integration, port: 8083, management_port: 9083, heap: 2g }

tomcat_version: "10.1.34"
tomcat_http_port: 8080
tomcat_shutdown_port: 8005
tomcat_max_threads: 400
tomcat_context: /efp-ui

nginx_worker_processes: auto
nginx_client_max_body_size: 64m
nginx_tls_protocols: "TLSv1.2 TLSv1.3"
nginx_hsts_max_age: 63072000
nginx_upstream_keepalive: 32

postgresql_version: 16
postgresql_port: 5432
postgresql_data_dir: /var/lib/pgsql/16/data
postgresql_max_connections: 400
postgresql_shared_buffers: 8GB
postgresql_effective_cache_size: 24GB
postgresql_work_mem: 16MB
postgresql_maintenance_work_mem: 1GB
postgresql_wal_level: replica
postgresql_archive_mode: "on"
postgresql_archive_dir: /var/lib/pgsql/wal_archive
postgresql_replication_user: replicator
postgresql_max_replication_lag_bytes: 134217728    # 128 MiB → alert threshold

backup_root: /backup/{{ platform_name }}
backup_full_schedule: "Sun *-*-* 04:00:00"
backup_incremental_schedule: "Mon..Sat *-*-* 04:00:00"
backup_retention_days: 90                   # DR vault keeps the long tail
backup_offsite_enabled: false               # this *is* the offsite target
backup_verify_schedule: "Fri *-*-* 03:00:00"
rpo_minutes: 15
rto_minutes: 120

prometheus_server: 10.40.40.11
node_exporter_port: 9100
promtail_loki_url: "http://10.40.40.11:3100/loki/api/v1/push"
alert_email: platform-ops@example.gov

hardening_profile: strict
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_allow_groups: ["sysadmins", "platform-ops"]
ssh_client_alive_interval: 300
ssh_max_auth_tries: 3
firewall_backend: nftables
selinux_state: enforcing
auditd_enabled: true
fail2ban_enabled: true
automatic_security_updates: false
password_max_age: 90
umask_default: "027"

ntp_servers: ["10.40.1.10", "10.40.1.11"]
dns_servers: ["10.40.1.10", "10.40.1.11"]
search_domains: ["{{ platform_domain }}"]
timezone: Africa/Kigali
