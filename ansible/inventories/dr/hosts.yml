---
# Disaster-recovery tier — secondary data centre (Huye).
# Warm standby: database streams continuously; application tier is built and
# patched in lockstep with production but runs with services stopped until a
# declared failover or a scheduled drill.
all:
  vars:
    env_tier: dr
    site_name: dc-secondary
    dr_mode: standby                     # standby | active  (flipped by dr-drill/failover)
  children:
    loadbalancers:
      hosts:
        lb-dr-01: { ansible_host: 10.40.10.11 }
    appservers:
      hosts:
        app-dr-01: { ansible_host: 10.40.20.11, app_node_id: 1 }
        app-dr-02: { ansible_host: 10.40.20.12, app_node_id: 2 }
    tomcat_nodes:
      hosts:
        zk-dr-01: { ansible_host: 10.40.20.21 }
    databases:
      children:
        db_replica:
          hosts:
            db-dr-01: { ansible_host: 10.40.30.11 }
      vars:
        postgresql_primary_host: 10.30.30.11     # streams from the prod primary
    monitoring:
      hosts:
        mon-dr-01: { ansible_host: 10.40.40.11 }
    backup:
      hosts:
        bkp-dr-01: { ansible_host: 10.40.50.11 }
    platform:
      children:
        loadbalancers:
        appservers:
        tomcat_nodes:
        databases:
        monitoring:
        backup:
