---
# Production tier — primary data centre (Kigali).
# Addresses are RFC1918 examples for a documented reference topology.
all:
  vars:
    env_tier: prod
    site_name: dc-primary
  children:
    loadbalancers:
      hosts:
        lb-prod-01: { ansible_host: 10.30.10.11 }
        lb-prod-02: { ansible_host: 10.30.10.12 }
      vars:
        keepalived_vip: 10.30.10.10
        keepalived_priority_map: { lb-prod-01: 150, lb-prod-02: 100 }

    appservers:
      hosts:
        app-prod-01: { ansible_host: 10.30.20.11, app_node_id: 1 }
        app-prod-02: { ansible_host: 10.30.20.12, app_node_id: 2 }
        app-prod-03: { ansible_host: 10.30.20.13, app_node_id: 3 }

    tomcat_nodes:
      hosts:
        zk-prod-01: { ansible_host: 10.30.20.21 }
        zk-prod-02: { ansible_host: 10.30.20.22 }

    databases:
      children:
        db_primary:
          hosts:
            db-prod-01: { ansible_host: 10.30.30.11 }
        db_replica:
          hosts:
            db-prod-02: { ansible_host: 10.30.30.12 }

    monitoring:
      hosts:
        mon-prod-01: { ansible_host: 10.30.40.11 }

    backup:
      hosts:
        bkp-prod-01: { ansible_host: 10.30.50.11 }

    platform:
      children:
        loadbalancers:
        appservers:
        tomcat_nodes:
        databases:
        monitoring:
        backup:
