---
# Test/UAT tier — production-shaped so that migration rehearsals are meaningful.
all:
  vars:
    env_tier: test
    site_name: dc-primary
  children:
    loadbalancers:
      hosts:
        lb-test-01: { ansible_host: 10.20.10.11 }
    appservers:
      hosts:
        app-test-01: { ansible_host: 10.20.20.11, app_node_id: 1 }
        app-test-02: { ansible_host: 10.20.20.12, app_node_id: 2 }
    tomcat_nodes:
      hosts:
        zk-test-01: { ansible_host: 10.20.20.21 }
    databases:
      children:
        db_primary:
          hosts:
            db-test-01: { ansible_host: 10.20.30.11 }
        db_replica:
          hosts:
            db-test-02: { ansible_host: 10.20.30.12 }
    monitoring:
      hosts:
        mon-test-01: { ansible_host: 10.20.40.11 }
    backup:
      hosts:
        bkp-test-01: { ansible_host: 10.20.50.11 }
    platform:
      children:
        loadbalancers:
        appservers:
        tomcat_nodes:
        databases:
        monitoring:
        backup:
